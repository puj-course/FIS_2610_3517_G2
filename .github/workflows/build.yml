name: SonarCloud Analysis
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt
          pip install anyio[asyncio] pytest-cov coverage
          echo "=== pytest-cov instalado? ==="
          pip show pytest-cov
      - name: Generar cobertura
        run: |
          cd backend
          echo "=== Corriendo pytest con coverage ==="
          python -m pytest tests/ -v --cov=app --cov-report=xml:coverage.xml --cov-report=term || true
          echo "=== Archivos generados ==="
          ls -la coverage.xml 2>/dev/null || echo "coverage.xml NO existe en backend/"
          ls -la ../coverage.xml 2>/dev/null || echo "coverage.xml NO existe en raiz"
      - name: Mover coverage a raiz
        run: |
          cp backend/coverage.xml ./coverage.xml 2>/dev/null || echo "No se pudo copiar"
          ls -la coverage.xml || echo "coverage.xml NO existe"
          echo "=== Primeras 10 lineas ==="
          head -10 coverage.xml 2>/dev/null || echo "No se puede leer"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
