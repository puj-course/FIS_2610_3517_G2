name: SonarCloud Analysis
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install anyio[asyncio] pytest-cov coverage
      - name: Generar cobertura
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=xml:../coverage.xml --cov-report=term || true
      - name: Verificar cobertura
        run: |
          ls -la coverage.xml
          head -8 coverage.xml
      - name: Ajustar rutas en coverage.xml
        run: |
          sed -i 's|<source>.*</source>|<source>backend/app</source>|g' coverage.xml
          echo "=== Source ajustado ==="
          grep "<source>" coverage.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
