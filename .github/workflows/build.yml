name: SonarCloud Analysis
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt
          pip install anyio[asyncio] pytest-cov
      - name: Generar cobertura desde raiz
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term || true
          echo "=== coverage.xml generado ==="
          ls -la coverage.xml
          echo "=== source path ==="
          grep -o '<source>[^<]*</source>' coverage.xml
      - name: Copiar y ajustar coverage
        run: |
          cp backend/coverage.xml coverage.xml
          python -c "
import re
with open('coverage.xml','r') as f: c=f.read()
c=re.sub(r'<source>[^<]*</source>','<source>backend/app</source>',c)
with open('coverage.xml','w') as f: f.write(c)
print('Fixed source paths')
          "
          echo "=== Verificacion ==="
          grep -o '<source>[^<]*</source>' coverage.xml
          echo "=== line-rate ==="
          grep -o 'line-rate="[^"]*"' coverage.xml | head -1
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
