name: SonarCloud Analysis
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock coverage
          
      - name: Generar cobertura
        run: |
          cd backend
          # Genera coverage.xml dentro de /backend
          python -m pytest tests/test_matches_repository.py \
            --cov=app/repositories \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-branch
          
          # Verifica que el archivo se creó
          ls -la coverage.xml
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
