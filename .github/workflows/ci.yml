name: Auto create issue

on:
  push:
    branches: [main]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Crear issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Nueva tarea automática",
              body: "Generada desde pipeline"
            })
