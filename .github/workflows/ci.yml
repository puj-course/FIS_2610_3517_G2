name: CI — Integración Continua

on:
  push:
    branches: [ "main", "develop", "feature/pipelines", "feature/docker-deploy" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' 

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest-cov anyio[asyncio] pytest-html httpx

      - name: Ejecutar tests con coverage
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --html=test-report.html \
            --self-contained-html

      - name: Subir reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddsengine-test-report
          path: backend/test-report.html
          retention-days: 30

      - name: Subir coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  validate-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci 

      - name: Build de produccion
        working-directory: frontend
        run: npm run build

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend] 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Descargar coverage del Backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/ 

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
