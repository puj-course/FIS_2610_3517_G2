name: CI — Integración Continua

# Se activa en push y pull_request a las ramas principales.
# Garantiza que cada cambio pase todas las pruebas antes de integrarse.
on:
  push:
    branches: [ "main", "develop", "feature/pipelines" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  # ── JOB 1: Tests del backend (pytest) ─────────────────────────────────────
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install anyio[asyncio]

      - name: Ejecutar tests con pytest
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short
        # Corre los 38 tests automáticos definidos en:
        # test_matches.py, test_combinations.py, test_error_handling.py,
        # test_integration_hu02.py

      - name: Resumen de resultados
        if: always()
        working-directory: backend
        run: |
          pytest tests/ --tb=no -q 2>/dev/null || true

  # ── JOB 2: Validación del frontend ────────────────────────────────────────
  validate-frontend:
    name: Frontend Validation (npm install + build check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Verificar que el build de producción no tiene errores
        working-directory: frontend
        run: npm run build

      - name: Confirmar artefacto generado
        working-directory: frontend
        run: |
          test -f dist/index.html && echo "✅ Build exitoso" || exit 1

  # ── JOB 3: Reporte de estado del PR ───────────────────────────────────────
  report-status:
    name: Reporte CI
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend]
    if: always()

    steps:
      - name: Resultado final del pipeline
        run: |
          echo "========================================"
          echo "  OddsEngine CI — Resumen"
          echo "========================================"
          echo "  Backend tests : ${{ needs.test-backend.result }}"
          echo "  Frontend build: ${{ needs.validate-frontend.result }}"
          echo "========================================"
          if [ "${{ needs.test-backend.result }}" = "failure" ] || \
             [ "${{ needs.validate-frontend.result }}" = "failure" ]; then
            echo "❌ El pipeline falló. Revisa los logs anteriores."
            exit 1
          fi
          echo "✅ Todos los checks pasaron correctamente."
