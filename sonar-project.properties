# Información general del proyecto
sonar.projectKey=puj-course_FIS_2610_3517_G2
sonar.organization=puj-course

# Rutas a las carpetas 
sonar.sources=backend/app
sonar.tests=backend/tests

# Exclusiones para que no analice código de pruebas o interfaces
sonar.exclusions=**/__pycache__/**, **/frontend/**, **/docs/**, **/jupyter/**
sonar.coverage.exclusions=**/tests/**, **/__pycache__/**, **/core/metrics.py

# Reportes de cobertura y pruebas (están dentro de /backend)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# Ignorar líneas de importación en la métrica de cobertura
sonar.python.coverage.ignoredLines=^import\s+,^from\s+.*\s+import\s+

# Versión de Python
sonar.python.version=3.10
