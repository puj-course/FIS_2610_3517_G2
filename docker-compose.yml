version: '3.8'

services:
  backend:
    image: ${DOCKER_USERNAME}/backend-oddsengine:${IMAGE_TAG:-latest}
    build:
      context: ./backend            
      dockerfile: Dockerfile         
    container_name: oddsengine-backend
    ports:
      - "8000:8000"                  

  frontend:
    image: ${DOCKER_USERNAME}/web-oddsengine:${IMAGE_TAG:-latest}
    build:
      context: ./frontend            
      dockerfile: Dockerfile         
    container_name: oddsengine-web
    ports:
      - "80:80"                      
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:8000
