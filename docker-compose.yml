# ============================================================
# OddsEngine — Docker Compose
# Orquesta 3 servicios: db (PostgreSQL), backend (FastAPI),
# frontend (React/Vite servido con nginx)
# ============================================================
 
version: "3.8"
 
services:
 
  # ----------------------------------------------------------
  # Base de datos PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: oddsengine-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oddsengine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  # ----------------------------------------------------------
  # Backend FastAPI
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddsengine-backend
    environment:
      DATA_MODE: database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/oddsengine
      DATABASE_SYNC_URL: postgresql://postgres:postgres@db:5432/oddsengine
      API_PROVIDER: mock
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
 
  # ----------------------------------------------------------
  # Frontend React/Vite (servido con nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oddsengine-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
 
# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  postgres_data:
