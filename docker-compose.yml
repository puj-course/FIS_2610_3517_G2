services:

  db:
    image: postgres:16-alpine
    container_name: oddsengine-db
    environment:
      POSTGRES_DB: oddsengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: 
      - backend-net
    restart: unless-stopped
    

  backend:
    image: juanpa1703/oddsengine-backend:latest
    build:
          context: ./backend
          dockerfile: Dockerfile
    container_name: oddsengine-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    

  frontend:
    image: juanpa1703/oddsengine-frontend:latest
    build:
          context: ./frontend
          dockerfile: Dockerfile
    container_name: oddsengine-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: unless-stopped

volumes:
   pgdata:
    driver: local
  
networks:
    frontend-net:
      driver: bridge
      name: oddsengine_frontend
    backend-net:
      driver: bridge
      name: oddsengine_backend
