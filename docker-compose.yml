services:

  # ── Backend FastAPI ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oddsengine-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Hot-reload: los cambios en código se reflejan al instante
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend React/Vite ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oddsengine-frontend
    ports:
      - "5173:5173"
    environment:
      # Le dice a Vite dónde está el backend DENTRO de la red Docker
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      # Hot-reload del frontend
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Evita que los node_modules del host sobreescriban los del contenedor
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL (solo si DATA_MODE=database) ────────────────────────
  db:
    image: postgres:16-alpine
    container_name: oddsengine-db
    environment:
      POSTGRES_DB: oddsengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      # Solo arranca si ejecutas: docker compose --profile database up
      - database

volumes:
  pgdata:
