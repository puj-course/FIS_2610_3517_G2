services:

  db:
    image: postgres:15-alpine
    container_name: oddsengine-db
    environment:
      POSTGRES_DB: oddsengine
      POSTGRES_USER: oddsengine_user
      POSTGRES_PASSWORD: oddsengine_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddsengine_user -d oddsengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddsengine-backend
    ports:
      - "8000:8000"
    environment:
      - DATA_MODE=mock
      - DATABASE_URL=postgresql+asyncpg://oddsengine_user:oddsengine_pass@db:5432/oddsengine
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: oddsengine-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
